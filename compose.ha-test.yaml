services:
  synergy-app:
    build:
      context: .
      dockerfile: ha_test/Dockerfile.app
      args:
        BUILD_ARCH: amd64
        BUILD_VERSION: "0.1.8"
    command: ["python", "-m", "wa_synergy.service"]
    environment:
      WA_SYNERGY_EMAIL: ${WA_SYNERGY_EMAIL:?WA_SYNERGY_EMAIL must be set}
      WA_SYNERGY_PASSWORD: ${WA_SYNERGY_PASSWORD:?WA_SYNERGY_PASSWORD must be set}
      WA_SYNERGY_GMAIL_APP_PASSWORD: ${WA_SYNERGY_GMAIL_APP_PASSWORD:?WA_SYNERGY_GMAIL_APP_PASSWORD must be set}
      WA_SYNERGY_API_TOKEN: ha-live-test-token-0123456789abcdef0123456789
      WA_SYNERGY_DB_PATH: /data/synergy.sqlite3
      WA_SYNERGY_SYNC_HOURS: "24"
      WA_SYNERGY_SYNC_RETRY_SECONDS: "5"
      WA_SYNERGY_BACKFILL_DAYS: ${WA_SYNERGY_LIVE_TEST_BACKFILL_DAYS:-14}
      WA_SYNERGY_REFRESH_DAYS: ${WA_SYNERGY_LIVE_TEST_BACKFILL_DAYS:-14}
      WA_SYNERGY_SYNC_ON_START: "true"
    volumes:
      - synergy-app-data:/data
    ports:
      - "18099:8099"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.0
    depends_on:
      - synergy-app
    environment:
      TZ: Australia/Perth
    volumes:
      - homeassistant-config:/config
      - ./ha_test/configuration.yaml:/config/configuration.yaml:ro
      - ./custom_components/wa_synergy:/config/custom_components/wa_synergy:ro
    ports:
      - "18123:18123"

volumes:
  synergy-app-data:
  homeassistant-config:
